<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest 3D Galaxy Studio</title>
    <!-- 조선일보명조체 (Chosunilbo_myungjo) 웹폰트 정의 -->
    <style>
        @font-face {
            font-family: 'Chosunilbo_myungjo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-base: #08090b;
            --accent-primary: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.08);
            --surface-glass: rgba(18, 20, 24, 0.88);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #8e95a2;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Chosunilbo_myungjo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body,
        button,
        input,
        textarea,
        select {
            font-family: 'Chosunilbo_myungjo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            letter-spacing: 0.1px;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-main);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- UI Overlay Header --- */
        #ui-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 100;
            max-width: 440px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            padding: 18px 20px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.1);
            transition: opacity 0.3s ease;
        }

        .header-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-badge {
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .sub-desc {
            margin: 0 0 12px 0;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Search Input */
        .search-box {
            position: relative;
            margin-bottom: 12px;
        }

        .search-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 9px 14px;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.55);
            font-weight: 500;
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Category Filter Tags */
        #filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
            padding-right: 4px;
        }

        #filter-bar::-webkit-scrollbar {
            width: 4px;
        }

        #filter-bar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-btn .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffffff;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            color: #fff;
            transform: translateY(-1px);
        }

        .filter-btn.active {
            background: #ffffff;
            border-color: #ffffff;
            color: #08090b;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.14);
        }

        .filter-btn.active .dot {
            background: #08090b !important;
        }

        /* --- Controls Toolbar (Top Right) --- */
        #controls-bar {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .button-group-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .tool-btn {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            color: #ffffff;
            padding: 9px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
            transform: translateY(-1px);
        }

        .tool-btn.active-mode {
            background: #ffffff;
            border-color: #ffffff;
            color: #08090b;
            font-weight: 700;
            box-shadow: 0 2px 10px rgba(255, 255, 255, 0.15);
        }

        /* Sliders Panel */
        .sliders-panel {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 10px 18px;
            display: flex;
            gap: 18px;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .slider-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15.5px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
        }

        .slider-item input[type="range"] {
            -webkit-appearance: none;
            width: 95px;
            height: 5px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .slider-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .slider-item input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .val-badge {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            min-width: 36px;
        }

        /* Focus Mode Status Bar */
        #focus-banner {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            color: #08090b;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        /* Loading Overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111318 0%, #08090b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .spinner-ring {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loading-text {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .progress-bar-bg {
            width: 260px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            border-radius: 10px;
            transition: width 0.15s ease;
        }

        #progress-sub {
            font-size: 12px;
            color: #94a3b8;
        }

        /* --- Preview Modal Card --- */
        #preview-card {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            background: var(--surface-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            padding: 16px;
            border-radius: 18px;
            display: none;
            color: #fff;
            max-width: 320px;
            width: calc(100vw - 48px);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.1);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .preview-img-container {
            position: relative;
            width: 100%;
            max-height: 280px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            cursor: zoom-in;
        }

        #preview-img {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }

        .preview-img-container:hover #preview-img {
            transform: scale(1.03);
        }

        /* --- Fullscreen Lightbox Modal --- */
        #lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 10, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .lightbox-content {
            position: relative;
            max-width: 92vw;
            max-height: 94vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            background: rgba(18, 20, 24, 0.96);
            padding: 18px;
        }

        #lightbox-img {
            max-width: 88vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .lightbox-info-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 14px;
            gap: 16px;
        }

        .lightbox-actions {
            display: flex;
            gap: 8px;
        }

        .lightbox-close-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .lightbox-close-btn:hover {
            transform: scale(1.15);
            background: rgba(255, 255, 255, 0.25);
        }

        .preview-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        #preview-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #ffffff;
        }

        .preview-ratio {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        #preview-name {
            font-size: 14.5px;
            font-weight: 600;
            word-break: break-all;
            color: #ffffff;
            margin-bottom: 14px;
            line-height: 1.45;
        }

        .preview-btn-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-tool-action {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-tool-action:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.35);
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-full-view {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-full-view:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .btn-close-card {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #cbd5e1;
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-close-card:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
        }

        /* --- Onboarding Simple Guide Card (빈 우주 화면에 자연스럽게 떠 있는 미니멀 위젯) --- */
        #guide-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            animation: fadeIn 0.3s ease;
        }

        .guide-box {
            position: relative;
            width: 90vw;
            max-width: 440px;
            background: rgba(14, 16, 20, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            padding: 26px 28px 22px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.1);
            color: #ffffff;
            user-select: none;
        }

        .guide-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: color 0.2s;
        }

        .guide-close:hover {
            color: #ffffff;
        }

        .guide-step-tag {
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .guide-title {
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .guide-desc {
            font-size: 14px;
            line-height: 1.65;
            color: #cbd5e1;
            min-height: 72px;
            margin-bottom: 20px;
        }

        .guide-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .guide-dots {
            display: flex;
            gap: 6px;
        }

        .guide-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s;
        }

        .guide-dot.active {
            width: 18px;
            border-radius: 4px;
            background: #ffffff;
        }

        .guide-nav-btns {
            display: flex;
            gap: 8px;
        }

        .btn-guide-nav {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #ffffff;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-guide-nav:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .btn-guide-primary {
            background: #ffffff;
            border-color: #ffffff;
            color: #08090b;
            font-weight: 700;
        }

        .btn-guide-primary:hover {
            background: #e2e8f0;
        }
    </style>
    <!-- Three.js + Controls + Tween.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>

<body>
    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Loading Indicator -->
    <div id="loading-overlay">
        <div class="spinner-ring"></div>
        <div id="loading-text">데이터 로딩 중...</div>
        <div class="progress-bar-bg">
            <div id="progress-bar-fill"></div>
        </div>
        <div id="progress-sub">0 / 0 (0%)</div>
    </div>

    <!-- Focus Mode Banner -->
    <div id="focus-banner" onclick="exitFocusMode()">
        <span>포커스 모드</span>
        <span style="opacity: 0.7; font-size: 11px;">[해제]</span>
    </div>

    <!-- UI Overlay Header -->
    <div id="ui-overlay">
        <div class="header-title-row">
            <h1>Pinterest Galaxy</h1>
            <div id="total-count-badge" class="stats-badge" style="display:none;">0장</div>
        </div>

        <!-- Search & Folder Input Row -->
        <div class="search-folder-row" style="display:flex; gap:8px; margin-bottom:12px;">
            <input type="file" id="folder-input" webkitdirectory directory multiple style="display:none;">
            <button class="tool-btn"
                style="flex-shrink:0; padding:8px 14px; font-size:14px; font-weight:700; background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.25);"
                onclick="document.getElementById('folder-input').click()" title="로컬 이미지 폴더 열기">
                폴더 열기
            </button>
            <div class="search-box" style="margin-bottom:0; flex:1;">
                <input type="text" id="search-input" placeholder="파일명 또는 카테고리 검색..." autocomplete="off">
            </div>
        </div>

        <div id="filter-bar">
            <button class="filter-btn active" data-category="ALL" onclick="filterCategory('ALL')"
                onpointerenter="setPlanetHoverSpotlight('ALL')" onpointerleave="clearPlanetHoverSpotlight()">
                <span class="dot" style="background:#ffffff;"></span>전체보기
            </button>
        </div>
    </div>

    <!-- Controls Bar (Top Right: 3D Viewport Controls ONLY) -->
    <div id="controls-bar">
        <!-- Layout Mode Buttons -->
        <div class="button-group-row">
            <button id="btn-mode-galaxy" class="tool-btn active-mode" onclick="switchLayout('galaxy')">폴더 행성계</button>
            <button id="btn-mode-sphere" class="tool-btn" onclick="switchLayout('sphere')">단일 구체</button>
            <button id="btn-mode-grid" class="tool-btn" onclick="switchLayout('grid')">격자 펼침</button>
            <button class="tool-btn" onclick="resetCameraView()">조망</button>
            <button class="tool-btn" onclick="toggleAutoRotate()">회전</button>
            <button class="tool-btn" onclick="openGuideModal(0)" title="사용 가이드 열기" style="padding:9px 12px; font-size:14px;">?</button>
        </div>

        <!-- Sliders for Space Expansion, Node Size, and Focus Dimming -->
        <div class="sliders-panel">
            <div class="slider-item">
                <span id="spread-label">은하 팽창:</span>
