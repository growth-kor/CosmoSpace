<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🪐 Pinterest 3D Galaxy Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07090e;
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.45);
            --surface-glass: rgba(15, 18, 28, 0.85);
            --border-glass: rgba(255, 255, 255, 0.14);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-base);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* --- UI Overlay Header --- */
        #ui-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 100;
            max-width: 440px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            padding: 18px 20px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.12);
            transition: opacity 0.3s ease;
        }

        .header-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        h1 {
            margin: 0;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 12px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #c7d2fe;
        }

        .sub-desc {
            margin: 0 0 12px 0;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Search Input */
        .search-box {
            position: relative;
            margin-bottom: 12px;
        }

        .search-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 14px 8px 34px;
            border-radius: 10px;
            color: #fff;
            font-size: 12.5px;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.09);
            border-color: #818cf8;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Category Filter Tags */
        #filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            max-height: 120px;
            overflow-y: auto;
            padding-right: 4px;
        }

        #filter-bar::-webkit-scrollbar {
            width: 4px;
        }

        #filter-bar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #cbd5e1;
            padding: 4px 9px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .filter-btn .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            transform: translateY(-1px);
        }

        .filter-btn.active {
            background: var(--accent-primary);
            border-color: #818cf8;
            color: #fff;
            font-weight: 700;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        /* --- Controls Toolbar (Top Right) --- */
        #controls-bar {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .button-group-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .tool-btn {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            color: #fff;
            padding: 7px 12px;
            border-radius: 11px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .tool-btn.active-mode {
            background: #4f46e5;
            border-color: #818cf8;
            box-shadow: 0 0 14px var(--accent-glow);
        }

        /* Sliders Panel */
        .sliders-panel {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 8px 14px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .slider-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11.5px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .slider-item input[type="range"] {
            -webkit-appearance: none;
            width: 90px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .slider-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #818cf8;
            box-shadow: 0 0 8px var(--accent-primary);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .slider-item input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .val-badge {
            font-size: 10.5px;
            color: #a5b4fc;
            min-width: 32px;
        }

        /* Focus Mode Status Bar */
        #focus-banner {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(99, 102, 241, 0.92);
            backdrop-filter: blur(14px);
            border: 1px solid #818cf8;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            cursor: pointer;
        }

        /* Loading Overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111528 0%, #05060a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .spinner-ring {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-text {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .progress-bar-bg {
            width: 260px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border-radius: 10px;
            transition: width 0.15s ease;
        }

        #progress-sub {
            font-size: 12px;
            color: #818cf8;
        }

        /* --- Preview Modal Card --- */
        #preview-card {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            background: var(--surface-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            padding: 16px;
            border-radius: 18px;
            display: none;
            color: #fff;
            max-width: 320px;
            width: calc(100vw - 48px);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.8), 0 0 24px rgba(99, 102, 241, 0.15);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-img-container {
            position: relative;
            width: 100%;
            max-height: 280px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            cursor: zoom-in;
        }

        #preview-img {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }

        .preview-img-container:hover #preview-img {
            transform: scale(1.03);
        }

        /* --- Fullscreen Lightbox Modal --- */
        #lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 12, 0.88);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox-content {
            position: relative;
            max-width: 92vw;
            max-height: 94vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            background: rgba(15, 18, 28, 0.96);
            padding: 18px;
        }

        #lightbox-img {
            max-width: 88vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .lightbox-info-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 14px;
            gap: 16px;
        }

        .lightbox-actions {
            display: flex;
            gap: 8px;
        }

        .lightbox-close-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #6366f1;
            border: 2px solid #fff;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
        }

        .lightbox-close-btn:hover {
            transform: scale(1.15);
            background: #4f46e5;
        }

        .preview-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        #preview-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            background: #6366f1;
            color: #fff;
        }

        .preview-ratio {
            font-size: 11px;
            color: var(--text-muted);
        }

        #preview-name {
            font-size: 13px;
            font-weight: 600;
            word-break: break-all;
            color: #e2e8f0;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .preview-btn-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-tool-action {
            background: rgba(99, 102, 241, 0.22);
            border: 1px solid rgba(99, 102, 241, 0.45);
            color: #c7d2fe;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-tool-action:hover {
            background: rgba(99, 102, 241, 0.45);
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-full-view {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-full-view:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-close-card {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-close-card:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
    <!-- Three.js + Controls + Tween.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>

<body>
    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Loading Indicator -->
    <div id="loading-overlay">
        <div class="spinner-ring"></div>
        <div id="loading-text">🌌 은하 데이터 로딩 중...</div>
        <div class="progress-bar-bg">
            <div id="progress-bar-fill"></div>
        </div>
        <div id="progress-sub">0 / 0 (0%)</div>
    </div>

    <!-- Focus Mode Banner -->
    <div id="focus-banner" onclick="exitFocusMode()">
        <span>🎯 포커스 모드 (주변 자동 투명화 중)</span>
        <span style="opacity: 0.7; font-size: 11px;">[여기를 눌러 해제]</span>
    </div>

    <!-- UI Overlay Header -->
    <div id="ui-overlay">
        <div class="header-title-row">
            <h1>🪐 Pinterest Galaxy</h1>
            <div id="total-count-badge" class="stats-badge">0장</div>
        </div>
        <p class="sub-desc">더블 클릭: 사진 상세 보기 & 포커스 · 드래그: 자유 비행 탐색</p>
        
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="파일명 또는 카테고리 검색..." autocomplete="off">
        </div>

        <div id="filter-bar">
            <button class="filter-btn active" data-category="ALL" onclick="filterCategory('ALL')">
                <span class="dot" style="background:#818cf8;"></span>전체보기
            </button>
        </div>
    </div>

    <!-- Controls Bar (Top Right) -->
    <div id="controls-bar">
        <!-- Layout Mode Buttons -->
        <div class="button-group-row">
            <button id="btn-mode-galaxy" class="tool-btn active-mode" onclick="switchLayout('galaxy')">🌌 은하 군집</button>
            <button id="btn-mode-sphere" class="tool-btn" onclick="switchLayout('sphere')">🌐 구체 표면 (0% 파묻힘)</button>
            <button id="btn-mode-grid" class="tool-btn" onclick="switchLayout('grid')">🔲 격자 펼침 (겹침 0%)</button>
            <button class="tool-btn" onclick="resetCameraView()">🔭 조망</button>
            <button class="tool-btn" onclick="toggleAutoRotate()">🔄 회전</button>
        </div>

        <!-- Sliders for Space Expansion, Node Size, and Focus Dimming -->
        <div class="sliders-panel">
            <div class="slider-item">
                <span id="spread-label">🌌 은하 팽창:</span>
                <input type="range" id="spread-slider" min="0.5" max="3.5" step="0.1" value="1.8">
                <span id="spread-val" class="val-badge">1.8x</span>
            </div>
            <div class="slider-item">
                <span>🔍 크기:</span>
                <input type="range" id="size-slider" min="8" max="28" step="1" value="16">
                <span id="size-val" class="val-badge">16px</span>
            </div>
            <div class="slider-item">
                <span>👻 배경 흐림:</span>
                <input type="range" id="dim-slider" min="0" max="100" step="5" value="20" title="선택 시 주변 사진 투명도 (0% = 완전 숨김, 100% = 흐림 없음)">
                <span id="dim-val" class="val-badge">20%</span>
            </div>
        </div>
    </div>

    <!-- Preview Card (Bottom Right) -->
    <div id="preview-card">
        <div class="preview-img-container" onclick="openLightbox()" title="클릭하여 전체화면 원본 확대">
            <img id="preview-img" src="" alt="preview">
        </div>
        <div class="preview-meta-row">
            <div id="preview-badge">CATEGORY</div>
            <div id="preview-ratio" class="preview-ratio">1.0 : 1</div>
        </div>
        <div id="preview-name">filename.jpg</div>
        <div class="preview-btn-row">
            <button class="btn-tool-action" onclick="flyToCurrentPhoto()" title="3D 공간에서 이 사진의 정면으로 카메라 즉시 이동">🎯 사진 바로가기</button>
            <button class="btn-tool-action" onclick="revealInFinder()" title="Mac Finder에서 실제 파일 위치 열기">📁 폴더 위치 열기</button>
            <button class="btn-tool-action" onclick="openLightbox()" title="전체화면 대형 원본 뷰어로 보기">🔍 대형 보기</button>
            <button class="btn-close-card" onclick="closePreview()">✕</button>
        </div>
    </div>

    <!-- Fullscreen Lightbox Modal -->
    <div id="lightbox-modal" onclick="closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="lightbox-close-btn" onclick="closeLightbox()">&times;</button>
            <img id="lightbox-img" src="" alt="Full resolution view">
            <div class="lightbox-info-bar">
                <div style="display:flex; align-items:center; gap:8px;">
                    <div id="lightbox-badge" class="stats-badge">CATEGORY</div>
                    <div id="lightbox-name" style="font-size:13px; font-weight:600; color:#e2e8f0;">filename.jpg</div>
                </div>
                <div class="lightbox-actions">
                    <button class="btn-tool-action" onclick="revealInFinder()">📁 폴더 위치 열기</button>
                    <a id="lightbox-link" class="btn-full-view" href="#" target="_blank">🔗 새 탭 열기</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Palette for category color coding
        const CATEGORY_PALETTE = [
            '#6366f1', '#ec4899', '#10b981', '#f59e0b', '#8b5cf6',
            '#06b6d4', '#f43f5e', '#14b8a6', '#3b82f6', '#d946ef'
        ];
        const categoryColorMap = {};

        function getCategoryColor(cat) {
            if (!categoryColorMap[cat]) {
                const keys = Object.keys(categoryColorMap);
                categoryColorMap[cat] = CATEGORY_PALETTE[keys.length % CATEGORY_PALETTE.length];
            }
            return categoryColorMap[cat];
        }

        // Three.js Scene Setup
        const container = document.getElementById("canvas-container");
        const scene = new THREE.Scene();
        // 안개(Fog) 완전 제거: 거리가 아무리 멀어져도 사진이 검게 어두워지지 않고 선명도 100% 유지!
        scene.fog = null;

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 3, 10000);
        const DEFAULT_CAM_POS = new THREE.Vector3(0, 120, 650);
        camera.position.copy(DEFAULT_CAM_POS);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x07090e, 1.0);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxDistance = 3500;
        controls.minDistance = 15;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.5;
        controls.screenSpacePanning = true;

        // Background Star Dust Particles
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1800;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 3500;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0x64748b,
            size: 2,
            transparent: true,
            opacity: 0.4
        });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        const textureLoader = new THREE.TextureLoader();
        const highResTextureCache = new Map(); // 원본 고화질 텍스처 전용 초고속 LRU 캐시
        const sprites = [];
        const categories = new Set();
        let currentFilter = "ALL";
        let searchQuery = "";
        let currentLayout = "galaxy";
        let focusedSprite = null;

        // Interactive Sliders State
        let galaxySpread = 1.8; // Default 1.8x spread for breathing room!
        let sphereRadiusScale = 1.0; // Default 1.0x sphere size (adjustable 0.3x ~ 3.0x!)
        let gridSpacingScale = 1.0;  // Default 1.0x grid spacing
        let nodeBaseSize = 16;  // Default 16px size
        let focusDimOpacity = 0.20; // Default 20% opacity for non-focused sprites (adjustable 0% ~ 100%)

        // UI Element References
        const loadingOverlay = document.getElementById("loading-overlay");
        const progressBarFill = document.getElementById("progress-bar-fill");
        const progressSub = document.getElementById("progress-sub");
        const totalBadge = document.getElementById("total-count-badge");
        const searchInput = document.getElementById("search-input");
        const previewCard = document.getElementById("preview-card");
        const previewImg = document.getElementById("preview-img");
        const previewName = document.getElementById("preview-name");
        const previewBadge = document.getElementById("preview-badge");
        const previewRatio = document.getElementById("preview-ratio");
        const previewLink = document.getElementById("preview-link");
        const focusBanner = document.getElementById("focus-banner");
        const spreadLabel = document.getElementById("spread-label");
        const spreadSlider = document.getElementById("spread-slider");
        const spreadVal = document.getElementById("spread-val");
        const sizeSlider = document.getElementById("size-slider");
        const sizeVal = document.getElementById("size-val");
        const dimSlider = document.getElementById("dim-slider");
        const dimVal = document.getElementById("dim-val");

        // Load Galaxy JSON
        fetch("galaxy_data.json")
            .then(res => {
                if (!res.ok) throw new Error("galaxy_data.json 파일을 찾을 수 없습니다.");
                return res.json();
            })
            .then(data => {
                const totalItems = data.length;
                totalBadge.innerText = `${totalItems}장`;
                let loadedCount = 0;

                function updateProgress() {
                    loadedCount++;
                    const percent = Math.min(100, Math.round((loadedCount / totalItems) * 100));
                    progressBarFill.style.width = percent + "%";
                    progressSub.innerText = `${loadedCount} / ${totalItems} (${percent}%)`;

                    if (loadedCount >= totalItems) {
                        setTimeout(() => {
                            loadingOverlay.style.opacity = "0";
                            setTimeout(() => loadingOverlay.style.display = "none", 600);
                            recalculateAllLayouts();
                        }, 200);
                    }
                }

                data.forEach((item, index) => {
                    categories.add(item.category);
                    const catColor = getCategoryColor(item.category);

                    // Load Thumbnail Texture
                    const thumbUrl = item.thumb_path || item.path;
                    textureLoader.load(
                        thumbUrl,
                        (texture) => {
                            const material = new THREE.SpriteMaterial({
                                map: texture,
                                transparent: true,
                                opacity: 1.0,
                                depthWrite: false
                            });
                            const sprite = new THREE.Sprite(material);

                            // Calculate aspect ratio scale
                            const aspect = item.aspect_ratio || 1.0;
                            updateSpriteScale(sprite, aspect, nodeBaseSize);

                            // Initial position with default 1.8x spread factor applied
                            const basePos = new THREE.Vector3(item.x, item.y, item.z);
                            sprite.position.copy(basePos).multiplyScalar(galaxySpread);

                            sprite.userData = {
                                ...item,
                                index: index,
                                color: catColor,
                                aspect: aspect,
                                baseGalaxyPos: basePos,
                                currentGalaxyPos: sprite.position.clone(),
                                spherePos: new THREE.Vector3(),
                                gridPos: new THREE.Vector3()
                            };

                            scene.add(sprite);
                            sprites.push(sprite);
                            updateProgress();
                        },
                        undefined,
                        (err) => {
                            console.warn("텍스처 로드 실패:", thumbUrl);
                            updateProgress();
                        }
                    );
                });

                // Populate Category Buttons
                const filterBar = document.getElementById("filter-bar");
                categories.forEach(cat => {
                    const btn = document.createElement("button");
                    btn.className = "filter-btn";
                    btn.dataset.category = cat;
                    const color = getCategoryColor(cat);
                    btn.innerHTML = `<span class="dot" style="background:${color};"></span>${cat}`;
                    btn.onclick = () => filterCategory(cat);
                    filterBar.appendChild(btn);
                });
            })
            .catch(err => {
                console.error("데이터 로드 오류:", err);
                document.getElementById("loading-text").innerText = "⚠️ galaxy_data.json 로드 실패";
                progressSub.innerText = "process_data.py를 먼저 실행해 주세요.";
            });

        function updateSpriteScale(sprite, aspect, baseSize) {
            let sx, sy;
            if (aspect >= 1.0) {
                sx = baseSize * Math.min(aspect, 2.5);
                sy = baseSize;
            } else {
                sx = baseSize;
                sy = baseSize / Math.max(aspect, 0.4);
            }
            sprite.scale.set(sx, sy, 1);
            if (sprite.userData) {
                sprite.userData.currentScale = sprite.scale.clone();
            }
        }

        // --- Layout Calculations (Grid & Hollow Fibonacci Sphere) ---
        function recalculateAllLayouts() {
            calculateSphereLayout();
            calculateGridLayout();
        }

        // 🌐 Fibonacci Hollow Sphere: 0% Buried images! Every single image on the outer shell!
        function calculateSphereLayout() {
            const visibleSprites = sprites.filter(s => s.visible);
            const count = visibleSprites.length;
            if (count === 0) return;

            // Radius scales dynamically with count and user's sphereRadiusScale!
            const baseRadius = Math.max(300, Math.sqrt(count) * 16.5);
            const radius = baseRadius * sphereRadiusScale;
            const goldenRatio = (1 + Math.sqrt(5)) / 2;

            visibleSprites.forEach((s, idx) => {
                const theta = 2 * Math.PI * idx / goldenRatio;
                const phi = Math.acos(1 - 2 * (idx + 0.5) / count);

                const x = radius * Math.cos(theta) * Math.sin(phi);
                const y = radius * Math.sin(theta) * Math.sin(phi);
                const z = radius * Math.cos(phi);

                s.userData.spherePos.set(x, y, z);
            });
        }

        // 🔲 Clean Non-Overlapping Grid Layout (수직/수평 정중앙 (0,0,0) 정렬)
        function calculateGridLayout() {
            const visibleSprites = sprites.filter(s => s.visible);
            const count = visibleSprites.length;
            if (count === 0) return;

            const cols = Math.ceil(Math.sqrt(count * 1.5));
            const rows = Math.ceil(count / cols);
            const spacingX = Math.max(nodeBaseSize * 2.2, 34) * gridSpacingScale;
            const spacingY = Math.max(nodeBaseSize * 1.9, 30) * gridSpacingScale;
            const offsetX = ((cols - 1) * spacingX) / 2;
            const offsetY = ((rows - 1) * spacingY) / 2;

            visibleSprites.forEach((s, idx) => {
                const col = idx % cols;
                const row = Math.floor(idx / cols);
                const x = col * spacingX - offsetX;
                const y = -row * spacingY + offsetY;
                const z = 0;
                s.userData.gridPos.set(x, y, z);
            });
        }

        // --- Layout Switcher ---
        window.switchLayout = function(mode) {
            currentLayout = mode;
            document.getElementById("btn-mode-galaxy").classList.toggle("active-mode", mode === 'galaxy');
            document.getElementById("btn-mode-sphere").classList.toggle("active-mode", mode === 'sphere');
            document.getElementById("btn-mode-grid").classList.toggle("active-mode", mode === 'grid');

            exitFocusMode();
            recalculateAllLayouts();

            sprites.forEach(sprite => {
                let targetPos;
                if (mode === 'grid') targetPos = sprite.userData.gridPos;
                else if (mode === 'sphere') targetPos = sprite.userData.spherePos;
                else targetPos = sprite.userData.currentGalaxyPos;

                new TWEEN.Tween(sprite.position)
                    .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, 1000)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .start();
            });

            const subDescEl = document.querySelector(".sub-desc");
            if (mode === 'grid') {
                // 🔲 격자 펼침 모드: 3D 회전을 잠그고 마우스 좌클릭 드래그를 2D 평면 패닝(슬라이드)으로 전환
                controls.enableRotate = false;
                controls.enablePan = true;
                controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
                controls.touches.ONE = THREE.TOUCH.PAN;
                if (subDescEl) subDescEl.innerText = "더블 클릭: 사진 상세 보기 · 좌클릭 드래그: 2D 캔버스 상하좌우 슬라이드 이동";

                spreadLabel.innerText = "🔲 격자 간격:";
                spreadSlider.min = "0.5";
                spreadSlider.max = "3.0";
                spreadSlider.value = gridSpacingScale;
                spreadVal.innerText = `${gridSpacingScale.toFixed(1)}x`;

                const visibleCount = sprites.filter(s => s.visible).length;
                const cols = Math.ceil(Math.sqrt(visibleCount * 1.5));
                const rows = Math.ceil(visibleCount / cols);
                const spacingX = Math.max(nodeBaseSize * 2.2, 34) * gridSpacingScale;
                const spacingY = Math.max(nodeBaseSize * 1.9, 30) * gridSpacingScale;
                const fitZ = Math.max(cols * spacingX * 0.9, rows * spacingY * 1.25, 750);

                new TWEEN.Tween(camera.position)
                    .to({ x: 0, y: 0, z: fitZ }, 1000)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .start();
                new TWEEN.Tween(controls.target)
                    .to({ x: 0, y: 0, z: 0 }, 1000)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .start();
            } else if (mode === 'sphere') {
                // 🌐 구체 표면 모드: 구의 중심을 바라보며 회전 탐색
                controls.enableRotate = true;
                controls.enablePan = false;
                controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
                controls.touches.ONE = THREE.TOUCH.ROTATE;
                if (subDescEl) subDescEl.innerText = "더블 클릭: 사진 상세 보기 · 드래그: 구체 표면 360° 궤도 회전";

                spreadLabel.innerText = "🌐 구체 크기:";
                spreadSlider.min = "0.3";
                spreadSlider.max = "3.0";
                spreadSlider.value = sphereRadiusScale;
                spreadVal.innerText = `${sphereRadiusScale.toFixed(1)}x`;

                const camZ = 920 * sphereRadiusScale;
                new TWEEN.Tween(camera.position)
                    .to({ x: 0, y: 80, z: camZ }, 1000)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .start();
                new TWEEN.Tween(controls.target)
                    .to({ x: 0, y: 0, z: 0 }, 1000)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .start();
            } else {
                // 🌌 은하 군집 모드: 3D 자유 회전 및 이동
                controls.enableRotate = true;
                controls.enablePan = true;
                controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
                controls.touches.ONE = THREE.TOUCH.ROTATE;
                if (subDescEl) subDescEl.innerText = "더블 클릭: 사진 상세 보기 & 포커스 · 드래그: 자유 비행 탐색";

                spreadLabel.innerText = "🌌 은하 팽창:";
                spreadSlider.min = "0.5";
                spreadSlider.max = "4.0";
                spreadSlider.value = galaxySpread;
                spreadVal.innerText = `${galaxySpread.toFixed(1)}x`;
                resetCameraView();
            }
        };

        // --- Sliders Listeners ---
        // 1. Dynamic Mode Expansion/Size Slider (Galaxy Spread / Sphere Radius / Grid Spacing)
        spreadSlider.addEventListener("input", (e) => {
            const val = parseFloat(e.target.value);
            spreadVal.innerText = `${val.toFixed(1)}x`;

            if (currentLayout === 'sphere') {
                sphereRadiusScale = val;
                calculateSphereLayout();
                sprites.forEach(sprite => {
                    if (sprite.visible) {
                        sprite.position.copy(sprite.userData.spherePos);
                    }
                });
            } else if (currentLayout === 'grid') {
                gridSpacingScale = val;
                calculateGridLayout();
                sprites.forEach(sprite => {
                    if (sprite.visible) {
                        sprite.position.copy(sprite.userData.gridPos);
                    }
                });
            } else {
                galaxySpread = val;
                sprites.forEach(sprite => {
                    if (sprite.userData && sprite.userData.baseGalaxyPos) {
                        sprite.userData.currentGalaxyPos.copy(sprite.userData.baseGalaxyPos).multiplyScalar(galaxySpread);
                        if (currentLayout === 'galaxy') {
                            sprite.position.copy(sprite.userData.currentGalaxyPos);
                        }
                    }
                });
            }
        });

        // 2. Node Size Slider (8px ~ 28px)
        sizeSlider.addEventListener("input", (e) => {
            nodeBaseSize = parseInt(e.target.value);
            sizeVal.innerText = `${nodeBaseSize}px`;

            sprites.forEach(sprite => {
                if (sprite.userData) {
                    updateSpriteScale(sprite, sprite.userData.aspect, nodeBaseSize);
                }
            });

            if (currentLayout === 'grid') {
                calculateGridLayout();
                sprites.filter(s => s.visible).forEach(sprite => {
                    sprite.position.copy(sprite.userData.gridPos);
                });
            }
        });

        // 3. Focus Dimming Slider (0% ~ 100%)
        dimSlider.addEventListener("input", (e) => {
            const v = parseInt(e.target.value);
            focusDimOpacity = v / 100.0;
            dimVal.innerText = `${v}%`;

            if (focusedSprite) {
                sprites.forEach(s => {
                    if (s !== focusedSprite) {
                        s.material.opacity = focusDimOpacity;
                    }
                });
            }
        });

        // Multi-Select Category Filter Logic
        const selectedCategories = new Set(["ALL"]);

        window.filterCategory = function (catName) {
            if (catName === "ALL") {
                selectedCategories.clear();
                selectedCategories.add("ALL");
            } else {
                if (selectedCategories.has("ALL")) {
                    // 전체보기 상태에서 특정 폴더를 누르면 해당 폴더 1개만 우선 선택
                    selectedCategories.clear();
                    selectedCategories.add(catName);
                } else {
                    // 다중 선택 토글 (이미 선택되어 있으면 해제, 없으면 추가)
                    if (selectedCategories.has(catName)) {
                        selectedCategories.delete(catName);
                        // 선택된 폴더가 하나도 없으면 자동으로 '전체보기' 복귀
                        if (selectedCategories.size === 0) {
                            selectedCategories.add("ALL");
                        }
                    } else {
                        selectedCategories.add(catName);
                    }
                }
            }

            // 모든 필터 버튼의 활성화(.active) 스타일 동기화
            document.querySelectorAll(".filter-btn").forEach(btn => {
                const cat = btn.dataset.category || (btn.innerText.includes("전체보기") ? "ALL" : btn.innerText.trim());
                const isActive = selectedCategories.has("ALL") ? (cat === "ALL") : selectedCategories.has(cat);
                btn.classList.toggle("active", isActive);
            });

            exitFocusMode();
            applyFilters();
            recalculateAllLayouts();

            if (currentLayout !== 'galaxy') {
                sprites.forEach(sprite => {
                    if (sprite.visible) {
                        const target = (currentLayout === 'grid') ? sprite.userData.gridPos : sprite.userData.spherePos;
                        new TWEEN.Tween(sprite.position)
                            .to({ x: target.x, y: target.y, z: target.z }, 600)
                            .easing(TWEEN.Easing.Cubic.Out)
                            .start();
                    }
                });
            }
        };

        // Instant Search
        searchInput.addEventListener("input", (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            exitFocusMode();
            applyFilters();
            recalculateAllLayouts();
        });

        function applyFilters() {
            let visibleCount = 0;
            const isAll = selectedCategories.has("ALL");

            sprites.forEach(sprite => {
                const data = sprite.userData;
                const matchCat = isAll || selectedCategories.has(data.category);
                const matchSearch = !searchQuery || data.filename.toLowerCase().includes(searchQuery) || data.category.toLowerCase().includes(searchQuery);

                const isVisible = matchCat && matchSearch;
                sprite.visible = isVisible;
                if (isVisible) visibleCount++;
            });

            const catDesc = isAll ? "전체" : `${selectedCategories.size}개 폴더`;
            totalBadge.innerText = `${visibleCount}장 (${catDesc})`;
        }

        // Raycaster for Hover & Click
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredSprite = null;

        window.addEventListener("pointermove", (e) => {
            if (e.target.closest("#ui-overlay") || e.target.closest("#preview-card") || e.target.closest("#controls-bar") || e.target.closest("#focus-banner")) {
                document.body.style.cursor = "default";
                return;
            }

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const visibleSprites = sprites.filter(s => s.visible);
            const intersects = raycaster.intersectObjects(visibleSprites);

            if (intersects.length > 0) {
                const target = intersects[0].object;
                if (hoveredSprite !== target) {
                    if (hoveredSprite && hoveredSprite !== focusedSprite && hoveredSprite.userData.currentScale) {
                        hoveredSprite.scale.copy(hoveredSprite.userData.currentScale);
                    }
                    hoveredSprite = target;
                    if (target.userData.currentScale) {
                        target.scale.copy(target.userData.currentScale).multiplyScalar(1.25);
                    }
                }
                document.body.style.cursor = "pointer";
            } else {
                if (hoveredSprite && hoveredSprite !== focusedSprite && hoveredSprite.userData.currentScale) {
                    hoveredSprite.scale.copy(hoveredSprite.userData.currentScale);
                    hoveredSprite = null;
                }
                document.body.style.cursor = "default";
            }
        });

        // 🖱️ 더블 클릭(Double-Click) 시에만 사진 보기 & 포커스 모드 작동!
        window.addEventListener("dblclick", (e) => {
            if (e.target.closest("#ui-overlay") || e.target.closest("#preview-card") || e.target.closest("#controls-bar") || e.target.closest("#focus-banner")) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const visibleSprites = sprites.filter(s => s.visible);
            const intersects = raycaster.intersectObjects(visibleSprites);

            if (intersects.length > 0) {
                const target = intersects[0].object;
                enterFocusMode(target);
            }
        });

        // 빈 배경 1회 클릭 시 포커스 해제 (드래그 회전 시 사진 오작동 방지)
        window.addEventListener("click", (e) => {
            if (e.target.closest("#ui-overlay") || e.target.closest("#preview-card") || e.target.closest("#controls-bar") || e.target.closest("#focus-banner")) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const visibleSprites = sprites.filter(s => s.visible);
            const intersects = raycaster.intersectObjects(visibleSprites);

            if (intersects.length === 0 && focusedSprite) {
                closePreview();
            }
        });

        // 🎯 Enter Focus Mode: Isolate target, fade other sprites into ghost mode, smart camera angle
        function enterFocusMode(target) {
            focusedSprite = target;
            const item = target.userData;

            // Show banner & preview card
            focusBanner.style.display = "flex";
            previewImg.src = item.path;
            previewBadge.innerText = item.category;
            previewBadge.style.background = item.color || "#6366f1";
            previewRatio.innerText = `비율: ${item.aspect || 1.0}`;
            previewName.innerText = item.filename;
            previewCard.style.display = "block";

            // 🌟 [원본 화질 즉시 스왑]: 더블 클릭된 대상 1장만 3D 공간에서 고해상도 원본 텍스처로 교체!
            const origPath = item.path;
            if (highResTextureCache.has(origPath)) {
                target.material.map = highResTextureCache.get(origPath);
                target.material.needsUpdate = true;
            } else {
                textureLoader.load(origPath, (tex) => {
                    tex.generateMipmaps = true;
                    highResTextureCache.set(origPath, tex);
                    if (focusedSprite === target) {
                        target.material.map = tex;
                        target.material.needsUpdate = true;
                    }
                });
            }

            // 1. Target: Full Opacity, Top RenderOrder, Scale highlight
            target.material.opacity = 1.0;
            target.renderOrder = 999;
            target.scale.copy(item.currentScale).multiplyScalar(1.25);

            // 2. All other sprites: Fade to adjustable Ghost Mode opacity!
            sprites.forEach(s => {
                if (s !== target) {
                    s.renderOrder = 0;
                    new TWEEN.Tween(s.material)
                        .to({ opacity: focusDimOpacity }, 250)
                        .start();
                    s.scale.copy(s.userData.currentScale);
                }
            });

            // 3. Smart Camera Vector:
            if (currentLayout === 'sphere') {
                // 🎯 구체 표면 모드: 구의 중심(0, 0, 0)을 똑바로 바라보며 대상 사진 앞에 카메라를 정렬!
                const radialDir = target.position.clone().normalize();
                const safeDistance = Math.max(nodeBaseSize * 3.5, 70);
                const targetCamPos = target.position.clone().addScaledVector(radialDir, safeDistance);

                new TWEEN.Tween(camera.position)
                    .to({ x: targetCamPos.x, y: targetCamPos.y, z: targetCamPos.z }, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();

                // 시선 중심(Target)을 구의 중심 (0,0,0)으로 엄격 고정하여 옆으로 회전 시 항상 구 중심을 바라봄!
                new TWEEN.Tween(controls.target)
                    .to({ x: 0, y: 0, z: 0 }, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
            } else {
                // 일반 은하계 / 격자 모드
                const camVector = new THREE.Vector3().subVectors(camera.position, target.position);
                if (camVector.length() < 1e-4) camVector.set(0, 0, 1);
                camVector.normalize();

                const safeDistance = Math.max(nodeBaseSize * 3.5, 60);
                const targetCamPos = new THREE.Vector3().copy(target.position).addScaledVector(camVector, safeDistance);

                new TWEEN.Tween(camera.position)
                    .to({ x: targetCamPos.x, y: targetCamPos.y, z: targetCamPos.z }, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();

                new TWEEN.Tween(controls.target)
                    .to({ x: target.position.x, y: target.position.y, z: target.position.z }, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
            }
        }

        // Exit Focus Mode -> Restore 100% Opacity to all nodes
        window.exitFocusMode = function() {
            focusBanner.style.display = "none";
            if (focusedSprite) {
                focusedSprite.renderOrder = 0;
                focusedSprite.scale.copy(focusedSprite.userData.currentScale);
                focusedSprite = null;
            }
            sprites.forEach(s => {
                new TWEEN.Tween(s.material)
                    .to({ opacity: 1.0 }, 400)
                    .start();
            });
        };

        window.closePreview = function() {
            previewCard.style.display = "none";
            exitFocusMode();
        };

        // 🎯 앱 상에서 해당 사진의 3D 위치로 카메라 즉시 비행
        window.flyToCurrentPhoto = function() {
            if (!focusedSprite) return;
            enterFocusMode(focusedSprite);
        };

        // 📁 Mac Finder에서 실제 사진 파일 위치 열기
        window.revealInFinder = function() {
            if (!focusedSprite || !focusedSprite.userData) return;
            const itemPath = focusedSprite.userData.path;
            fetch("/api/reveal?path=" + encodeURIComponent(itemPath))
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'ok') {
                        console.log("[Finder] 파일 위치 열기 완료:", itemPath);
                    } else {
                        alert("폴더 열기 실패: " + itemPath);
                    }
                })
                .catch(err => {
                    console.error("Finder API 오류:", err);
                    alert("실제 파일 위치:\n" + itemPath);
                });
        };

        // 🔍 풀스크린 대형 라이트박스 뷰어 열기 / 닫기
        window.openLightbox = function() {
            if (!focusedSprite || !focusedSprite.userData) return;
            const item = focusedSprite.userData;
            const modal = document.getElementById("lightbox-modal");
            document.getElementById("lightbox-img").src = item.path;
            document.getElementById("lightbox-badge").innerText = item.category;
            document.getElementById("lightbox-badge").style.background = item.color || "#6366f1";
            document.getElementById("lightbox-name").innerText = item.filename;
            document.getElementById("lightbox-link").href = item.path;
            modal.style.display = "flex";
        };

        window.closeLightbox = function() {
            const modal = document.getElementById("lightbox-modal");
            if (modal) modal.style.display = "none";
        };

        // ESC 키로 대형 뷰어 및 포커스 닫기
        window.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                closeLightbox();
                closePreview();
            }
        });

        window.resetCameraView = function() {
            exitFocusMode();
            let targetPos = DEFAULT_CAM_POS;
            if (currentLayout === 'grid') {
                const visibleCount = sprites.filter(s => s.visible).length;
                const cols = Math.ceil(Math.sqrt(visibleCount * 1.5));
                const rows = Math.ceil(visibleCount / cols);
                const spacingX = Math.max(nodeBaseSize * 2.2, 34);
                const spacingY = Math.max(nodeBaseSize * 1.9, 30);
                const fitZ = Math.max(cols * spacingX * 0.9, rows * spacingY * 1.25, 750);
                targetPos = new THREE.Vector3(0, 0, fitZ);
            } else if (currentLayout === 'sphere') {
                targetPos = new THREE.Vector3(0, 80, 900);
            }

            new TWEEN.Tween(camera.position)
                .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, 900)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            new TWEEN.Tween(controls.target)
                .to({ x: 0, y: 0, z: 0 }, 900)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();
        };

        window.toggleAutoRotate = function() {
            controls.autoRotate = !controls.autoRotate;
        };

        // Window Resize
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Main Animation Loop
        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);

            // 구체 표면 모드에서는 시선 피벗이 (0,0,0) 중심에서 이탈하지 않도록 락 유지
            if (currentLayout === 'sphere' && !focusedSprite) {
                controls.target.set(0, 0, 0);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
