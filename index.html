    <script>
        // Palette for category color coding (정제된 미니멀 티타늄 & 모노크롬 스튜디오 팔레트)
        const CATEGORY_PALETTE = [
            '#e2e8f0', '#94a3b8', '#cbd5e1', '#64748b', '#cbd5e1',
            '#d4d4d8', '#a1a1aa', '#71717a', '#a8a29e', '#78716c'
        ];
        const categoryColorMap = {};

        function getCategoryColor(cat) {
            if (!categoryColorMap[cat]) {
                const keys = Object.keys(categoryColorMap);
                categoryColorMap[cat] = CATEGORY_PALETTE[keys.length % CATEGORY_PALETTE.length];
            }
            return categoryColorMap[cat];
        }

        // Three.js Scene Setup
        const container = document.getElementById("canvas-container");
        const scene = new THREE.Scene();
        // 안개(Fog) 완전 제거: 거리가 아무리 멀어져도 사진이 검게 어두워지지 않고 선명도 100% 유지!
        scene.fog = null;

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100000);
        const DEFAULT_CAM_POS = new THREE.Vector3(0, 120, 650);
        camera.position.copy(DEFAULT_CAM_POS);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x08090b, 1.0);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxDistance = 60000; // 거리 락 해제: 우주 끝까지 시원하게 조망 가능!
        controls.minDistance = 0.5;   // 근접 클리핑 해제: 코앞에서도 잘림 0%!
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.5;
        controls.screenSpacePanning = true;

        // Background Realistic Deep Space Stars (방해되지 않는 은은하고 사실적인 심우주 성단)
        const starGeo = new THREE.BufferGeometry();
        const starCount = 3600;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);

        // 천문학적 별 색온도 팔레트: 순백(A형), 미세한 백청색(B형), 따뜻한 미색(G형), 옅은 앰버(K형)
        const starColorPalette = [
            new THREE.Color(0xffffff), // 화이트 (주류)
            new THREE.Color(0xf1f5f9), // 플래티넘 화이트
            new THREE.Color(0xe2e8f0), // 쿨 실버
            new THREE.Color(0xdbeafe), // 미세한 페일 블루 (오리온/베가 성운 느낌)
            new THREE.Color(0xfef3c7), // 따뜻한 미색
        ];

        for (let i = 0; i < starCount; i++) {
            // 구면 무작위 쉘 분포로 공간 입체감 극대화 (가까운 별 30%, 먼 배경 별 70%)
            const radius = 1200 + Math.random() * 16000;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);

            starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = radius * Math.cos(phi);

            const pickedColor = starColorPalette[Math.floor(Math.random() * starColorPalette.length)];
            // 사진 감상에 방해되지 않도록 명도를 0.4~0.75 수준으로 은은하게 조율
            const brightness = 0.35 + Math.random() * 0.45;
            starColors[i * 3] = pickedColor.r * brightness;
            starColors[i * 3 + 1] = pickedColor.g * brightness;
            starColors[i * 3 + 2] = pickedColor.b * brightness;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        // 원형 포인트 캔버스 텍스처로 네모난 도트가 아닌 부드러운 발광 구체 별 생성
        function createStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(240, 245, 255, 0.8)');
            gradient.addColorStop(0.6, 'rgba(200, 220, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        const starMat = new THREE.PointsMaterial({
            size: 2.2,
            map: createStarTexture(),
            vertexColors: true,
            transparent: true,
            opacity: 0.65,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        const textureLoader = new THREE.TextureLoader();
        const highResTextureCache = new Map(); // 원본 고화질 텍스처 전용 초고속 LRU 캐시
        const sprites = [];
        const categories = new Set();
        let currentFilter = "ALL";
        let searchQuery = "";
        let currentLayout = "galaxy";
        let focusedSprite = null;

        // Interactive Sliders State
        let galaxySpread = 1.8; // Default 1.8x spread for breathing room!
        let sphereRadiusScale = 1.0; // Default 1.0x sphere size (adjustable 0.3x ~ 3.0x!)
        let gridSpacingScale = 1.0;  // Default 1.0x grid spacing
        let nodeBaseSize = 16;  // Default 16px size
        let focusDimOpacity = 0.20; // Default 20% opacity for non-focused sprites (adjustable 0% ~ 100%)

        // UI Element References
        const loadingOverlay = document.getElementById("loading-overlay");
        const progressBarFill = document.getElementById("progress-bar-fill");
        const progressSub = document.getElementById("progress-sub");
        const totalBadge = document.getElementById("total-count-badge");
        const searchInput = document.getElementById("search-input");
        const previewCard = document.getElementById("preview-card");
        const previewImg = document.getElementById("preview-img");
        const previewName = document.getElementById("preview-name");
        const previewBadge = document.getElementById("preview-badge");
        const previewRatio = document.getElementById("preview-ratio");
        const previewLink = document.getElementById("preview-link");
        const focusBanner = document.getElementById("focus-banner");
        const spreadLabel = document.getElementById("spread-label");
        const spreadSlider = document.getElementById("spread-slider");
        const spreadVal = document.getElementById("spread-val");
        const sizeSlider = document.getElementById("size-slider");
        const sizeVal = document.getElementById("size-val");
        const dimSlider = document.getElementById("dim-slider");
        const dimVal = document.getElementById("dim-val");

        // 🌟 100% 브라우저 순수 클라이언트 은하 데이터 구축 및 렌더러
        // 🪐 행성 구체 메타데이터 & 3D 네온 라벨 보관소
        const planetMetaMap = new Map();
        const planetLabels = [];

        // 텍스트를 담은 3D 미니멀 티타늄 빌보드 스프라이트 생성기
        function createPlanetLabelSprite(text, count, colorHex) {
            const canvas = document.createElement("canvas");
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext("2d");

            // 절제된 차콜 글래스 필박스 (과한 네온 번짐 제거)
            ctx.fillStyle = "rgba(18, 20, 24, 0.90)";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
            ctx.lineWidth = 2.5;
            const r = 24;
            ctx.beginPath();
            ctx.roundRect(16, 16, 480, 96, r);
            ctx.fill();
            ctx.stroke();

            // 차분하고 선명한 화이트 텍스트
            ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
            ctx.shadowBlur = 4;
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 34px 'DeltaGlassKR', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const labelStr = `${text} (${count}장)`;
            ctx.fillText(labelStr, 256, 64);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(140, 35, 1);
            return sprite;
        }

        // 🌟 은하 데이터 및 메모리 완전 정리
        function clearCurrentGalaxy() {
            // 이전 스프라이트 메모리 해제 및 씬 정리
            sprites.forEach(s => {
                if (s.material) {
                    if (s.material.map && s.material.map.isBlobUrl) {
                        try { URL.revokeObjectURL(s.material.map.image.src); } catch (e) { }
                        s.material.map.dispose();
                    }
                    s.material.dispose();
                }
                scene.remove(s);
            });
            sprites.length = 0;

            // 행성 3D 라벨 정리
            planetLabels.forEach(lbl => {
                if (lbl.material) {
                    if (lbl.material.map) lbl.material.map.dispose();
                    lbl.material.dispose();
                }
                scene.remove(lbl);
            });
            planetLabels.length = 0;
            planetMetaMap.clear();

            categories.clear();
            selectedCategories.clear();
            selectedCategories.add("ALL");
            highResTextureCache.clear();

            // 필터 버튼 초기화 (전체보기만 남김)
            const filterBar = document.getElementById("filter-bar");
            filterBar.innerHTML = `
                <button class="filter-btn active" data-category="ALL" onclick="filterCategory('ALL')">
                    <span class="dot" style="background:#818cf8;"></span>전체보기
                </button>
            `;
            searchQuery = "";
            searchInput.value = "";
            exitFocusMode();
        }

        // 🪐 [폴더 행성계 알고리즘]: 각 폴더를 3D 우주 공간에 독립된 구체 행성으로 수학적 완벽 배치
        function generatePlanetaryGalaxyCoordinates(items) {
            // 1. 카테고리(하위 폴더)별 그룹화
            const catMap = new Map();
            items.forEach(it => {
                const cat = it.category || "기본";
                if (!catMap.has(cat)) catMap.set(cat, []);
                catMap.get(cat).push(it);
            });

            const totalPlanets = catMap.size;
            let planetIdx = 0;
            const goldenAngle = Math.PI * (3 - Math.sqrt(5));

            let cumulativeOrbit = 0;
            catMap.forEach((pItems, catName) => {
                const pCount = pItems.length;
                // 사진 개수에 비례하는 구체 행성 반지름 (표면 배치로 겹침 0%)
                const planetRadius = Math.max(55, Math.sqrt(pCount) * 23.0) * sphereRadiusScale;
                const catColor = getCategoryColor(catName);

                // 우주 은하 나선 궤도상에 각 행성 중심점(Center) 배치 (행성 간 충돌 방지 안전거리 확보)
                let center;
                if (totalPlanets === 1) {
                    center = new THREE.Vector3(0, 0, 0);
                } else {
                    cumulativeOrbit += (planetRadius * 1.5 + 280);
                    const orbitDist = Math.max(260, cumulativeOrbit * 0.7);
                    const angle = planetIdx * 2.39996; // 황금비 분산 나선 각도
                    const height = (Math.sin(planetIdx * 1.4) * (planetRadius * 0.45));
                    center = new THREE.Vector3(
                        Math.cos(angle) * orbitDist,
                        height,
                        Math.sin(angle) * orbitDist
                    );
                }

                planetMetaMap.set(catName, {
                    name: catName,
                    center: center.clone(),
                    radius: planetRadius,
                    count: pCount,
                    color: catColor
                });

                // 행성 상단에 은은한 3D 네온 폴더명 라벨 배치
                const labelSprite = createPlanetLabelSprite(catName, pCount, catColor);
                labelSprite.position.set(center.x, center.y + planetRadius + 32, center.z);
                labelSprite.userData = { category: catName, isPlanetLabel: true };
                scene.add(labelSprite);
                planetLabels.push(labelSprite);

                // 행성 표면에 피보나치 구면 알고리즘으로 사진들을 오차 0% 완벽한 균등 간격 배치
                pItems.forEach((it, i) => {
                    const theta = i * goldenAngle;
                    const phi = Math.acos(1 - 2 * (i + 0.5) / pCount);

                    const lx = planetRadius * Math.cos(theta) * Math.sin(phi);
                    const ly = planetRadius * Math.sin(theta) * Math.sin(phi);
                    const lz = planetRadius * Math.cos(phi);

                    it.x = center.x + lx;
                    it.y = center.y + ly;
                    it.z = center.z + lz;
                    it.planetCenter = center.clone();
                    it.planetRadius = planetRadius;
                });

                planetIdx++;
            });

            return items;
        }

        // 🚀 인메모리 고속 캔버스 썸네일 압축 엔진 (300px 고화질 WebP, VRAM 폭발 원천 차단)
        function createThumbnailBlob(file, maxDim = 300) {
            return new Promise((resolve) => {
                const img = new Image();
                const tempUrl = URL.createObjectURL(file);
                img.onload = () => {
                    const origW = img.naturalWidth || img.width || 300;
                    const origH = img.naturalHeight || img.height || 300;
                    let w = origW, h = origH;
                    if (w > h) {
                        if (w > maxDim) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        }
                    } else {
                        if (h > maxDim) {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                    }
                    const canvas = document.createElement("canvas");
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext("2d");
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = "high";
                    ctx.drawImage(img, 0, 0, w, h);
                    URL.revokeObjectURL(tempUrl);

                    canvas.toBlob((blob) => {
                        const thumbUrl = blob ? URL.createObjectURL(blob) : tempUrl;
                        const aspect = Math.round((origW / Math.max(origH, 1)) * 100) / 100;
                        resolve({ thumbUrl, aspect });
                    }, "image/webp", 0.85);
                };
                img.onerror = () => {
                    resolve({ thumbUrl: tempUrl, aspect: 1.0 });
                };
                img.src = tempUrl;
            });
        }

        // 데이터 리스트를 Three.js 3D 공간에 렌더링 (대용량 2,000+장 브라우저 프리징 방지 청크 로딩)
        function loadGalaxyItems(dataList) {
            clearCurrentGalaxy();
            closeGuideModal();

            const totalItems = dataList.length;
            totalBadge.style.display = totalItems > 0 ? "inline-block" : "none";
            totalBadge.innerText = `${totalItems}장`;
            loadingOverlay.style.display = "flex";
            loadingOverlay.style.opacity = "1";
            progressBarFill.style.width = "0%";
            progressSub.innerText = `0 / ${totalItems} (0%)`;

            let loadedCount = 0;
            function updateProgress() {
                loadedCount++;
                const percent = Math.min(100, Math.round((loadedCount / totalItems) * 100));
                progressBarFill.style.width = percent + "%";
                progressSub.innerText = `${loadedCount} / ${totalItems} (${percent}%)`;

                if (loadedCount >= totalItems) {
                    setTimeout(() => {
                        loadingOverlay.style.opacity = "0";
                        setTimeout(() => loadingOverlay.style.display = "none", 600);
                        recalculateAllLayouts();
                        resetCameraView();
                    }, 100);
                }
            }

            // 카테고리 미리 집계 및 버튼 생성
            dataList.forEach(item => categories.add(item.category));
            const filterBar = document.getElementById("filter-bar");
            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = "filter-btn";
                btn.dataset.category = cat;
                const color = getCategoryColor(cat);
                btn.innerHTML = `<span class="dot" style="background:${color};"></span>${cat}`;
                btn.onclick = () => filterCategory(cat);
                btn.onpointerenter = () => setPlanetHoverSpotlight(cat);
                btn.onpointerleave = () => clearPlanetHoverSpotlight();
                filterBar.appendChild(btn);
            });

            // 🚀 브라우저 메인 스레드 프리징 방지: 50장씩 requestAnimationFrame 배치로 텍스처 로드
            const BATCH_SIZE = 50;
            let currentIdx = 0;

            function processBatch() {
                const end = Math.min(currentIdx + BATCH_SIZE, totalItems);
                for (let index = currentIdx; index < end; index++) {
                    const item = dataList[index];
                    const catColor = getCategoryColor(item.category);
                    const thumbUrl = item.thumb_path || item.path;

                    textureLoader.load(
                        thumbUrl,
                        (texture) => {
                            if (item.isBlob) texture.isBlobUrl = true;
                            const material = new THREE.SpriteMaterial({
                                map: texture,
                                transparent: true,
                                opacity: 1.0,
                                depthWrite: false
                            });
                            const sprite = new THREE.Sprite(material);

                            const aspect = item.aspect_ratio || 1.0;
                            updateSpriteScale(sprite, aspect, nodeBaseSize);

                            const basePos = new THREE.Vector3(item.x, item.y, item.z);
                            sprite.position.copy(basePos).multiplyScalar(galaxySpread);

                            sprite.userData = {
                                ...item,
                                index: index,
                                color: catColor,
                                aspect: aspect,
                                baseGalaxyPos: basePos,
                                currentGalaxyPos: sprite.position.clone(),
                                spherePos: new THREE.Vector3(),
                                gridPos: new THREE.Vector3()
                            };

                            scene.add(sprite);
                            sprites.push(sprite);
                            updateProgress();
                        },
                        undefined,
                        () => {
                            updateProgress();
                        }
                    );
                }

                currentIdx = end;
                if (currentIdx < totalItems) {
                    requestAnimationFrame(processBatch);
                }
            }

            requestAnimationFrame(processBatch);
        }

        // 📂 [폴더 선택 브라우저 직독 & 스마트 썸네일 엔진]: 파이썬 0% 완전 브라우저 독립 실행
        async function handleFolderSelection(fileList) {
            if (!fileList || fileList.length === 0) return;

            const allFiles = Array.from(fileList);
            const validExts = ['.jpg', '.jpeg', '.png', '.webp', '.avif', '.gif', '.bmp'];

            // 1. 기존 galaxy_data.json 및 thumbnails/가 포함된 폴더인지 스마트 감지
            const jsonFile = allFiles.find(f => f.name.toLowerCase() === "galaxy_data.json");
            const thumbFiles = allFiles.filter(f => f.webkitRelativePath && f.webkitRelativePath.includes("/thumbnails/"));

            if (jsonFile && thumbFiles.length > 0) {
                // 🌟 [초고속 스마트 로드]: 기존에 캐시된 썸네일과 UMAP 은하 좌표가 있으므로 0.1초 만에 즉시 로드!
                loadingOverlay.style.display = "flex";
                loadingOverlay.style.opacity = "1";
                document.getElementById("loading-text").innerText = "기존 은하 데이터 고속 복원 중...";
                progressBarFill.style.width = "40%";

                try {
                    const jsonText = await jsonFile.text();
                    const rawData = JSON.parse(jsonText);

                    // 썸네일 파일 맵 구축
                    const thumbMap = new Map();
                    thumbFiles.forEach(tf => {
                        const norm = tf.webkitRelativePath.replace(/\\/g, '/');
                        thumbMap.set(norm, tf);
                        // 파일명으로도 보조 매핑
                        thumbMap.set(tf.name, tf);
                    });

                    // 원본 파일 맵 구축
                    const origMap = new Map();
                    allFiles.forEach(f => {
                        const norm = (f.webkitRelativePath || f.name).replace(/\\/g, '/');
                        origMap.set(norm, f);
                        origMap.set(f.name, f);
                    });

                    const processedData = rawData.map(it => {
                        const tFile = thumbMap.get(it.thumb_path) || thumbMap.get(it.thumb_path ? it.thumb_path.split('/').pop() : "");
                        const oFile = origMap.get(it.path) || origMap.get(it.filename);
                        const tUrl = tFile ? URL.createObjectURL(tFile) : it.thumb_path;
                        const oUrl = oFile ? URL.createObjectURL(oFile) : (tUrl || it.path);

                        return {
                            ...it,
                            thumb_path: tUrl,
                            path: oUrl,
                            isBlob: true,
                            fileObj: oFile
                        };
                    });

                    // 폴더별 행성계 3D 좌표 산출
                    const galaxyItems = generatePlanetaryGalaxyCoordinates(processedData);
                    loadGalaxyItems(galaxyItems);
                    return;
                } catch (err) {
                    console.warn("기존 JSON 파싱 실패, 신규 폴더 분석 모드로 전환:", err);
                }
            }

            // 2. 신규 사진 폴더 (또는 일반 사진들) ➔ 고화질 인메모리 캔버스 썸네일 압축 파이프라인
            const rawPhotoFiles = allFiles.filter(f => {
                const name = f.name.toLowerCase();
                const rel = (f.webkitRelativePath || f.name).toLowerCase();
                return validExts.some(ext => name.endsWith(ext)) && !rel.includes('/.') && !rel.includes('/thumbnails/');
            });

            if (rawPhotoFiles.length === 0) {
                alert("선택한 폴더에 지원되는 이미지(.jpg, .png, .webp, .avif)가 없습니다.");
                return;
            }

            loadingOverlay.style.display = "flex";
            loadingOverlay.style.opacity = "1";
            document.getElementById("loading-text").innerText = "고화질 썸네일 압축 중...";
            progressBarFill.style.width = "0%";
            progressSub.innerText = `0 / ${rawPhotoFiles.length} (0%)`;

            const parsedItems = [];
            const THUMB_BATCH = 10;
            const totalCount = rawPhotoFiles.length;

            for (let i = 0; i < totalCount; i += THUMB_BATCH) {
                const slice = rawPhotoFiles.slice(i, i + THUMB_BATCH);
                const batchPromises = slice.map(async (f) => {
                    const relPath = f.webkitRelativePath || f.name;
                    const parts = relPath.split('/');
                    let category = "기본";
                    if (parts.length > 2) {
                        category = parts[1]; // 하위 폴더명을 카테고리로 지정
                    } else if (parts.length === 2) {
                        category = parts[0];
                    }

                    // 300px 고화질 WebP 인메모리 캔버스 압축 (VRAM 폭발 0%)
                    const { thumbUrl, aspect } = await createThumbnailBlob(f, 300);

                    return {
                        filename: f.name,
                        path: thumbUrl, // 초기에는 썸네일 주소, 필요 시 fileObj로부터 원본 스왑
                        thumb_path: thumbUrl,
                        category: category,
                        aspect_ratio: aspect,
                        isBlob: true,
                        fileObj: f
                    };
                });

                const batchResults = await Promise.all(batchPromises);
                parsedItems.push(...batchResults);

                const currentDone = Math.min(i + THUMB_BATCH, totalCount);
                const pct = Math.round((currentDone / totalCount) * 100);
                progressBarFill.style.width = pct + "%";
                progressSub.innerText = `${currentDone} / ${totalCount} (${pct}%)`;
            }

            // 🪐 폴더별 행성계 3D 좌표 즉시 연산 (수학 알고리즘)
            document.getElementById("loading-text").innerText = "3D 행성계 생성 중...";
            const galaxyItems = generatePlanetaryGalaxyCoordinates(parsedItems);
            loadGalaxyItems(galaxyItems);
        }

        // 폴더 인풋 이벤트 바인딩
        const folderInput = document.getElementById("folder-input");
        if (folderInput) {
            folderInput.addEventListener("change", (e) => {
                handleFolderSelection(e.target.files);
            });
        }

        // 🌐 화면 드래그 앤 드롭으로도 폴더 바로 열기 지원
        window.addEventListener("dragover", (e) => {
            e.preventDefault();
        });
        window.addEventListener("drop", (e) => {
            e.preventDefault();
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFolderSelection(e.dataTransfer.files);
            }
        });

        // 온보딩 간단 사용 가이드 (텍스트 슬라이드 카드)
        const GUIDE_STEPS = [
            {
                tag: "GUIDE 1 / 4",
                title: "폴더 열기 및 드롭",
                desc: "좌측 상단의 [폴더 열기] 버튼을 누르거나 내 컴퓨터의 사진 폴더를 화면 어디든 끌어다 놓으세요. 수천 장의 사진도 컴퓨터 멈춤 없이 3D 우주 은하로 즉시 펼쳐집니다."
            },
            {
                tag: "GUIDE 2 / 4",
                title: "자유로운 회전과 확대",
                desc: "마우스 왼쪽 버튼을 누른 채 드래그하면 3D 은하를 자유롭게 둘러볼 수 있습니다. 마우스 휠을 돌리거나 키보드의 - / + 키(또는 대괄호 [ / ] 키)를 눌러 사진들을 시원하게 당겨보고 멀리 조망할 수 있습니다."
            },
            {
                tag: "GUIDE 3 / 4",
                title: "폴더 바로가기 및 키보드 이동",
                desc: "좌측 하단의 폴더 이름을 클릭하면 해당 폴더 사진들이 모여있는 곳으로 카메라가 부드럽게 날아가 정면으로 보여줍니다. W, A, S, D 키를 누르면 사진들 사이를 비행하며 탐색할 수 있습니다."
            },
            {
                tag: "GUIDE 4 / 4",
                title: "초고화질 확대 및 이미지 복사",
                desc: "사진을 더블 클릭하면 즉시 최고 화질 원본으로 크게 확대됩니다. [이미지 복사] 버튼을 누르면 사진이 클립보드에 바로 복사되어 카카오톡이나 문서에 곧바로 붙여넣기(Cmd+V)할 수 있습니다."
            }
        ];

        let currentGuideIdx = 0;
        const guideModal = document.getElementById("guide-modal");
        const guideStepTag = document.getElementById("guide-step-tag");
        const guideTitle = document.getElementById("guide-title");
        const guideDesc = document.getElementById("guide-desc");
        const btnGuidePrev = document.getElementById("btn-guide-prev");
        const btnGuideNext = document.getElementById("btn-guide-next");
        const guideDots = document.querySelectorAll(".guide-dot");

        function showGuideStep(idx) {
            currentGuideIdx = Math.max(0, Math.min(idx, GUIDE_STEPS.length - 1));
            const step = GUIDE_STEPS[currentGuideIdx];
            guideStepTag.innerText = step.tag;
            guideTitle.innerText = step.title;
            guideDesc.innerText = step.desc;

            guideDots.forEach((d, i) => {
                d.classList.toggle("active", i === currentGuideIdx);
            });

            btnGuidePrev.style.display = currentGuideIdx === 0 ? "none" : "block";
            if (currentGuideIdx === GUIDE_STEPS.length - 1) {
                btnGuideNext.innerText = "시작하기";
            } else {
                btnGuideNext.innerText = "다음";
            }
        }

        function nextGuideStep() {
            if (currentGuideIdx < GUIDE_STEPS.length - 1) {
                showGuideStep(currentGuideIdx + 1);
            } else {
                closeGuideModal();
            }
        }

        function prevGuideStep() {
            if (currentGuideIdx > 0) {
                showGuideStep(currentGuideIdx - 1);
            }
        }

        function openGuideModal(stepIdx = 0) {
            showGuideStep(stepIdx);
            guideModal.style.display = "flex";
        }

        function closeGuideModal() {
            guideModal.style.display = "none";
            localStorage.setItem("pinter_guide_seen", "true");
        }

        // 초기 시작: galaxy_data.json이 있으면 기본 로드, 없으면 안내 가이드 오픈
        fetch("galaxy_data.json")
            .then(res => {
                if (!res.ok) throw new Error("galaxy_data.json 파일 없음");
                return res.json();
            })
            .then(data => {
                const galaxyItems = generatePlanetaryGalaxyCoordinates(data);
                loadGalaxyItems(galaxyItems);
            })
            .catch(() => {
                loadingOverlay.style.opacity = "0";
                setTimeout(() => loadingOverlay.style.display = "none", 400);
                // 첫 방문 시 또는 사진 데이터가 없을 때 가이드 카드 오픈
                openGuideModal(0);
            });

        function updateSpriteScale(sprite, aspect, baseSize) {
            let sx, sy;
            if (aspect >= 1.0) {
                sx = baseSize * Math.min(aspect, 2.5);
                sy = baseSize;
            } else {
                sx = baseSize;
                sy = baseSize / Math.max(aspect, 0.4);
            }
            sprite.scale.set(sx, sy, 1);
            if (sprite.userData) {
                sprite.userData.currentScale = sprite.scale.clone();
            }
        }

        // --- Layout Calculations (Grid & Hollow Fibonacci Sphere) ---
        function recalculateAllLayouts() {
            calculateSphereLayout();
            calculateGridLayout();
        }

        // 🌐 Fibonacci Hollow Sphere: 0% Buried images! Every single image on the outer shell!
        function calculateSphereLayout() {
            const visibleSprites = sprites.filter(s => s.visible);
            const count = visibleSprites.length;
            if (count === 0) return;

            // Radius scales dynamically with count and user's sphereRadiusScale!
            const baseRadius = Math.max(300, Math.sqrt(count) * 16.5);
            const radius = baseRadius * sphereRadiusScale;
            const goldenRatio = (1 + Math.sqrt(5)) / 2;

            visibleSprites.forEach((s, idx) => {
                const theta = 2 * Math.PI * idx / goldenRatio;
                const phi = Math.acos(1 - 2 * (idx + 0.5) / count);

                const x = radius * Math.cos(theta) * Math.sin(phi);
                const y = radius * Math.sin(theta) * Math.sin(phi);
                const z = radius * Math.cos(phi);

                s.userData.spherePos.set(x, y, z);
            });
        }

        // 🔲 Clean Non-Overlapping Grid Layout (수직/수평 정중앙 (0,0,0) 정렬)
        function calculateGridLayout() {
            const visibleSprites = sprites.filter(s => s.visible);
            const count = visibleSprites.length;
            if (count === 0) return;

            const cols = Math.ceil(Math.sqrt(count * 1.5));
            const rows = Math.ceil(count / cols);
            const spacingX = Math.max(nodeBaseSize * 2.2, 34) * gridSpacingScale;
            const spacingY = Math.max(nodeBaseSize * 1.9, 30) * gridSpacingScale;
            const offsetX = ((cols - 1) * spacingX) / 2;
            const offsetY = ((rows - 1) * spacingY) / 2;

            visibleSprites.forEach((s, idx) => {
                const col = idx % cols;
                const row = Math.floor(idx / cols);
                const x = col * spacingX - offsetX;
                const y = -row * spacingY + offsetY;
                const z = 0;
                s.userData.gridPos.set(x, y, z);
            });
        }

        // --- Layout Switcher ---
        window.switchLayout = function (mode) {
            currentLayout = mode;
            document.getElementById("btn-mode-galaxy").classList.toggle("active-mode", mode === 'galaxy');
            document.getElementById("btn-mode-sphere").classList.toggle("active-mode", mode === 'sphere');
            document.getElementById("btn-mode-grid").classList.toggle("active-mode", mode === 'grid');

            exitFocusMode();
            recalculateAllLayouts();

            // 행성 3D 라벨은 폴더 행성계(galaxy) 모드일 때만 표시
            planetLabels.forEach(lbl => {
                const cat = lbl.userData.category;
                const matchCat = selectedCategories.has("ALL") || selectedCategories.has(cat);
                lbl.visible = (mode === 'galaxy') && matchCat;
            });

            sprites.forEach(sprite => {
                let targetPos;
                if (mode === 'grid') targetPos = sprite.userData.gridPos;
                else if (mode === 'sphere') targetPos = sprite.userData.spherePos;
                else targetPos = sprite.userData.currentGalaxyPos;

                new TWEEN.Tween(sprite.position)
                    .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, 1000)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .start();
            });

            if (mode === 'grid') {
                // 격자 펼침 모드: 3D 회전을 잠그고 마우스 좌클릭 드래그를 2D 평면 패닝(슬라이드)으로 전환
                controls.enableRotate = false;
                controls.enablePan = true;
                controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
                controls.touches.ONE = THREE.TOUCH.PAN;

                spreadLabel.innerText = "격자 간격:";
                spreadSlider.min = "0.5";
                spreadSlider.max = "3.0";
                spreadSlider.value = gridSpacingScale;
                spreadVal.innerText = `${gridSpacingScale.toFixed(1)}x`;

                const visibleCount = sprites.filter(s => s.visible).length;
                const cols = Math.ceil(Math.sqrt(visibleCount * 1.5));
                const rows = Math.ceil(visibleCount / cols);
                const spacingX = Math.max(nodeBaseSize * 2.2, 34) * gridSpacingScale;
                const spacingY = Math.max(nodeBaseSize * 1.9, 30) * gridSpacingScale;
                const fitZ = Math.max(cols * spacingX * 0.9, rows * spacingY * 1.25, 750);

                camera.up.set(0, 1, 0);
                new TWEEN.Tween(camera.position)
                    .to({ x: 0, y: 0, z: fitZ }, 1000)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .start();
                new TWEEN.Tween(controls.target)
                    .to({ x: 0, y: 0, z: 0 }, 1000)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .start();
            } else if (mode === 'sphere') {
                // 구체 표면 모드: 구의 중심을 바라보며 회전 탐색
                controls.enableRotate = true;
                controls.enablePan = false;
                controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
                controls.touches.ONE = THREE.TOUCH.ROTATE;

                spreadLabel.innerText = "구체 크기:";
                spreadSlider.min = "0.3";
                spreadSlider.max = "3.0";
                spreadSlider.value = sphereRadiusScale;
                spreadVal.innerText = `${sphereRadiusScale.toFixed(1)}x`;

                const camZ = 920 * sphereRadiusScale;
                new TWEEN.Tween(camera.position)
                    .to({ x: 0, y: 80, z: camZ }, 1000)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .start();
                new TWEEN.Tween(controls.target)
                    .to({ x: 0, y: 0, z: 0 }, 1000)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .start();
            } else {
                // 은하 군집 (폴더 행성계) 모드: 3D 자유 회전 및 이동
                controls.enableRotate = true;
                controls.enablePan = true;
                controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
                controls.touches.ONE = THREE.TOUCH.ROTATE;

                spreadLabel.innerText = "은하 팽창:";
                spreadSlider.min = "0.5";
                spreadSlider.max = "4.0";
                spreadSlider.value = galaxySpread;
                spreadVal.innerText = `${galaxySpread.toFixed(1)}x`;
                resetCameraView();
            }
        };

        // --- Sliders Listeners ---
        // 1. Dynamic Mode Expansion/Size Slider (Galaxy Spread / Sphere Radius / Grid Spacing)
        spreadSlider.addEventListener("input", (e) => {
            const val = parseFloat(e.target.value);
            spreadVal.innerText = `${val.toFixed(1)}x`;

            if (currentLayout === 'sphere') {
                sphereRadiusScale = val;
                calculateSphereLayout();
                sprites.forEach(sprite => {
                    if (sprite.visible) {
                        sprite.position.copy(sprite.userData.spherePos);
                    }
                });
            } else if (currentLayout === 'grid') {
                gridSpacingScale = val;
                calculateGridLayout();
                sprites.forEach(sprite => {
                    if (sprite.visible) {
                        sprite.position.copy(sprite.userData.gridPos);
                    }
                });
            } else {
                galaxySpread = val;
                sprites.forEach(sprite => {
                    if (sprite.userData && sprite.userData.baseGalaxyPos) {
                        sprite.userData.currentGalaxyPos.copy(sprite.userData.baseGalaxyPos).multiplyScalar(galaxySpread);
                        if (currentLayout === 'galaxy') {
                            sprite.position.copy(sprite.userData.currentGalaxyPos);
                        }
                    }
                });
            }
        });

        // 2. Node Size Slider (8px ~ 28px)
        sizeSlider.addEventListener("input", (e) => {
            nodeBaseSize = parseInt(e.target.value);
            sizeVal.innerText = `${nodeBaseSize}px`;

            sprites.forEach(sprite => {
                if (sprite.userData) {
                    updateSpriteScale(sprite, sprite.userData.aspect, nodeBaseSize);
                }
            });

            if (currentLayout === 'grid') {
                calculateGridLayout();
                sprites.filter(s => s.visible).forEach(sprite => {
                    sprite.position.copy(sprite.userData.gridPos);
                });
            }
        });

        // 3. Focus Dimming Slider (0% ~ 100%)
        dimSlider.addEventListener("input", (e) => {
            const v = parseInt(e.target.value);
            focusDimOpacity = v / 100.0;
            dimVal.innerText = `${v}%`;

            if (focusedSprite) {
                sprites.forEach(s => {
                    if (s !== focusedSprite) {
                        s.material.opacity = focusDimOpacity;
                    }
                });
            }
        });

        // 슬라이더 조작 완료(마우스/터치 해제 및 값 확정) 즉시 포커스 자동 해제하여 WASD 키보드 입력 복원
        [spreadSlider, sizeSlider, dimSlider].forEach(slider => {
            slider.addEventListener("change", () => slider.blur());
            slider.addEventListener("pointerup", () => slider.blur());
        });

        // Multi-Select Category Filter Logic
        const selectedCategories = new Set(["ALL"]);
        let hoveredCategory = null;

        // 🌟 [호버 스포트라이트]: 폴더 버튼에 마우스 올리면 해당 행성만 100% 또렷하게 빛나고, 다른 행성은 은은하게 사라짐
        window.setPlanetHoverSpotlight = function (catName) {
            if (currentLayout !== 'galaxy' && currentLayout !== 'sphere') return;
            hoveredCategory = catName;

            sprites.forEach(sprite => {
                const isTarget = (catName === "ALL") || (sprite.userData && sprite.userData.category === catName);
                new TWEEN.Tween(sprite.material)
                    .to({ opacity: isTarget ? 1.0 : 0.08 }, 220)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
            });

            // 3D 텍스트 라벨도 해당 폴더 라벨만 또렷하게 강조
            planetLabels.forEach(lbl => {
                const isTarget = (catName === "ALL") || (lbl.userData && lbl.userData.category === catName);
                new TWEEN.Tween(lbl.material)
                    .to({ opacity: isTarget ? 1.0 : 0.1 }, 220)
                    .start();
            });
        };

        window.clearPlanetHoverSpotlight = function () {
            if (!hoveredCategory) return;
            hoveredCategory = null;

            sprites.forEach(sprite => {
                if (sprite.visible) {
                    new TWEEN.Tween(sprite.material)
                        .to({ opacity: 1.0 }, 250)
                        .easing(TWEEN.Easing.Cubic.Out)
                        .start();
                }
            });

            planetLabels.forEach(lbl => {
                if (lbl.visible) {
                    new TWEEN.Tween(lbl.material)
                        .to({ opacity: 0.9 }, 250)
                        .start();
                }
            });
        };

        window.filterCategory = function (catName) {
            if (catName === "ALL") {
                selectedCategories.clear();
                selectedCategories.add("ALL");
            } else {
                if (selectedCategories.has("ALL")) {
                    // 전체보기 상태에서 특정 폴더를 누르면 해당 폴더 1개만 우선 선택
                    selectedCategories.clear();
                    selectedCategories.add(catName);
                } else {
                    // 다중 선택 토글 (이미 선택되어 있으면 해제, 없으면 추가)
                    if (selectedCategories.has(catName)) {
                        selectedCategories.delete(catName);
                        // 선택된 폴더가 하나도 없으면 자동으로 '전체보기' 복귀
                        if (selectedCategories.size === 0) {
                            selectedCategories.add("ALL");
                        }
                    } else {
                        selectedCategories.add(catName);
                    }
                }
            }

            // 모든 필터 버튼의 활성화(.active) 스타일 동기화
            document.querySelectorAll(".filter-btn").forEach(btn => {
                const cat = btn.dataset.category || (btn.innerText.includes("전체보기") ? "ALL" : btn.innerText.trim());
                const isActive = selectedCategories.has("ALL") ? (cat === "ALL") : selectedCategories.has(cat);
                btn.classList.toggle("active", isActive);
            });

            exitFocusMode();
            applyFilters();
            recalculateAllLayouts();

            // 행성 3D 라벨 가시성 동기화
            planetLabels.forEach(lbl => {
                const cat = lbl.userData.category;
                lbl.visible = (currentLayout === 'galaxy') && (selectedCategories.has("ALL") || selectedCategories.has(cat));
            });

            if (currentLayout === 'galaxy') {
                // 🚀 단일 폴더 선택 시 해당 행성 구체 앞으로 카메라 워프 비행 (Warp Flight)
                if (selectedCategories.size === 1 && !selectedCategories.has("ALL")) {
                    const selCat = Array.from(selectedCategories)[0];
                    const meta = planetMetaMap.get(selCat);
                    if (meta) {
                        const targetCamZ = meta.center.z + Math.max(meta.radius * 2.3, 160);
                        const targetCamY = meta.center.y + Math.max(meta.radius * 0.35, 25);
                        new TWEEN.Tween(camera.position)
                            .to({ x: meta.center.x, y: targetCamY, z: targetCamZ }, 900)
                            .easing(TWEEN.Easing.Cubic.InOut)
                            .start();
                        new TWEEN.Tween(controls.target)
                            .to({ x: meta.center.x, y: meta.center.y, z: meta.center.z }, 900)
                            .easing(TWEEN.Easing.Cubic.InOut)
                            .start();
                    }
                } else if (selectedCategories.has("ALL")) {
                    resetCameraView();
                }
            } else {
                sprites.forEach(sprite => {
                    if (sprite.visible) {
                        const target = (currentLayout === 'grid') ? sprite.userData.gridPos : sprite.userData.spherePos;
                        new TWEEN.Tween(sprite.position)
                            .to({ x: target.x, y: target.y, z: target.z }, 600)
                            .easing(TWEEN.Easing.Cubic.Out)
                            .start();
                    }
                });
            }
        };

        // Instant Search
        searchInput.addEventListener("input", (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            exitFocusMode();
            applyFilters();
            recalculateAllLayouts();
        });

        // 검색창에서 Enter나 Escape 입력 시 즉시 포커스를 해제(blur)하여 키보드 WASD 네비게이션 복귀
        searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === "Escape") {
                searchInput.blur();
            }
        });

        function applyFilters() {
            let visibleCount = 0;
            const isAll = selectedCategories.has("ALL");

            sprites.forEach(sprite => {
                const data = sprite.userData;
                const matchCat = isAll || selectedCategories.has(data.category);
                const matchSearch = !searchQuery || data.filename.toLowerCase().includes(searchQuery) || data.category.toLowerCase().includes(searchQuery);

                const isVisible = matchCat && matchSearch;
                sprite.visible = isVisible;
                if (isVisible) visibleCount++;
            });

            const catDesc = isAll ? "전체" : `${selectedCategories.size}개 폴더`;
            totalBadge.innerText = `${visibleCount}장 (${catDesc})`;
        }

        // Raycaster for Hover & Click
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredSprite = null;

        window.addEventListener("pointermove", (e) => {
            if (e.target.closest("#ui-overlay") || e.target.closest("#preview-card") || e.target.closest("#controls-bar") || e.target.closest("#focus-banner")) {
                document.body.style.cursor = "default";
                return;
            }

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const visibleSprites = sprites.filter(s => s.visible);
            const intersects = raycaster.intersectObjects(visibleSprites);

            if (intersects.length > 0) {
                const target = intersects[0].object;
                if (hoveredSprite !== target) {
                    if (hoveredSprite && hoveredSprite !== focusedSprite && hoveredSprite.userData.currentScale) {
                        hoveredSprite.scale.copy(hoveredSprite.userData.currentScale);
                    }
                    hoveredSprite = target;
                    if (target.userData.currentScale) {
                        target.scale.copy(target.userData.currentScale).multiplyScalar(1.25);
                    }
                }
                document.body.style.cursor = "pointer";
            } else {
                if (hoveredSprite && hoveredSprite !== focusedSprite && hoveredSprite.userData.currentScale) {
                    hoveredSprite.scale.copy(hoveredSprite.userData.currentScale);
                    hoveredSprite = null;
                }
                document.body.style.cursor = "default";
            }
        });

        // 🖱️ 더블 클릭(Double-Click) 시에만 사진 보기 & 포커스 모드 작동!
        window.addEventListener("dblclick", (e) => {
            if (e.target.closest("#ui-overlay") || e.target.closest("#preview-card") || e.target.closest("#controls-bar") || e.target.closest("#focus-banner")) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const visibleSprites = sprites.filter(s => s.visible);
            const intersects = raycaster.intersectObjects(visibleSprites);

            if (intersects.length > 0) {
                const target = intersects[0].object;
                enterFocusMode(target);
            }
        });

        // 빈 배경 1회 클릭 시 포커스 해제 (드래그 회전 시 사진 오작동 방지 및 입력창 포커스 자동 반환)
        window.addEventListener("click", (e) => {
            // 캔버스나 배경을 클릭했을 때 활성화된 input/textarea 포커스를 즉시 해제하여 키보드 WASD 제어권 복원
            if (!e.target.closest("#ui-overlay") && !e.target.closest("#controls-bar") && document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }

            if (e.target.closest("#ui-overlay") || e.target.closest("#preview-card") || e.target.closest("#controls-bar") || e.target.closest("#focus-banner")) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const visibleSprites = sprites.filter(s => s.visible);
            const intersects = raycaster.intersectObjects(visibleSprites);

            if (intersects.length === 0 && focusedSprite) {
                closePreview();
            }
        });

        // 🎯 Enter Focus Mode: Isolate target, fade other sprites into ghost mode, smart camera angle
        function enterFocusMode(target) {
            focusedSprite = target;
            const item = target.userData;

            // Show banner & preview card
            focusBanner.style.display = "flex";
            previewImg.src = item.path;
            previewBadge.innerText = item.category;
            previewBadge.style.background = item.color || "#6366f1";
            previewRatio.innerText = `비율: ${item.aspect || 1.0}`;
            previewName.innerText = item.filename;
            previewCard.style.display = "block";

            // 🌟 [원본 화질 즉시 스왑]: 더블 클릭된 대상 1장만 3D 공간에서 고해상도 원본 텍스처로 교체!
            let origPath = item.path;
            if (item.fileObj && (!item.fullResUrl || item.path === item.thumb_path)) {
                if (!item.fullResUrl) {
                    item.fullResUrl = URL.createObjectURL(item.fileObj);
                }
                origPath = item.fullResUrl;
                item.path = origPath;
                previewImg.src = origPath;
            }

            if (highResTextureCache.has(origPath)) {
                target.material.map = highResTextureCache.get(origPath);
                target.material.needsUpdate = true;
            } else {
                textureLoader.load(origPath, (tex) => {
                    tex.generateMipmaps = true;
                    highResTextureCache.set(origPath, tex);
                    if (focusedSprite === target) {
                        target.material.map = tex;
                        target.material.needsUpdate = true;
                    }
                });
            }

            // 1. Target: Full Opacity, Top RenderOrder, Scale highlight
            target.material.opacity = 1.0;
            target.renderOrder = 999;
            target.scale.copy(item.currentScale).multiplyScalar(1.25);

            // 2. All other sprites: Fade to adjustable Ghost Mode opacity!
            sprites.forEach(s => {
                if (s !== target) {
                    s.renderOrder = 0;
                    new TWEEN.Tween(s.material)
                        .to({ opacity: focusDimOpacity }, 250)
                        .start();
                    s.scale.copy(s.userData.currentScale);
                }
            });

            // 3. Smart Camera Vector:
            if (currentLayout === 'sphere') {
                // 🎯 구체 표면 모드: 구의 중심(0, 0, 0)을 똑바로 바라보며 대상 사진 앞에 카메라를 정렬!
                const radialDir = target.position.clone().normalize();
                const safeDistance = Math.max(nodeBaseSize * 3.5, 70);
                const targetCamPos = target.position.clone().addScaledVector(radialDir, safeDistance);

                new TWEEN.Tween(camera.position)
                    .to({ x: targetCamPos.x, y: targetCamPos.y, z: targetCamPos.z }, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();

                // 시선 중심(Target)을 구의 중심 (0,0,0)으로 엄격 고정하여 옆으로 회전 시 항상 구 중심을 바라봄!
                new TWEEN.Tween(controls.target)
                    .to({ x: 0, y: 0, z: 0 }, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
            } else if (currentLayout === 'grid') {
                // 🔲 격자 모드: 사진 평면과 완벽하게 1:1 수직 정대면(Orthogonal) 정렬!
                // 목이 돌아가거나 각도가 삐뚤어지지 않도록 시선 중심을 타겟 사진 정중앙(x, y, 0)에 두고 카메라는 (x, y, Z) 수직선상에 정확히 배치!
                const safeDistance = Math.max(nodeBaseSize * 3.5, 60);
                const targetCamPos = new THREE.Vector3(target.position.x, target.position.y, safeDistance);

                // 카메라 업 벡터도 정방향 (0, 1, 0) 보정
                camera.up.set(0, 1, 0);

                new TWEEN.Tween(camera.position)
                    .to({ x: targetCamPos.x, y: targetCamPos.y, z: targetCamPos.z }, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();

                new TWEEN.Tween(controls.target)
                    .to({ x: target.position.x, y: target.position.y, z: 0 }, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
            } else {
                // 🌌 일반 은하계 모드
                const camVector = new THREE.Vector3().subVectors(camera.position, target.position);
                if (camVector.length() < 1e-4) camVector.set(0, 0, 1);
                camVector.normalize();

                const safeDistance = Math.max(nodeBaseSize * 3.5, 60);
                const targetCamPos = new THREE.Vector3().copy(target.position).addScaledVector(camVector, safeDistance);

                new TWEEN.Tween(camera.position)
                    .to({ x: targetCamPos.x, y: targetCamPos.y, z: targetCamPos.z }, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();

                new TWEEN.Tween(controls.target)
                    .to({ x: target.position.x, y: target.position.y, z: target.position.z }, 800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
            }
        }

        // Exit Focus Mode -> Restore 100% Opacity to all nodes
        window.exitFocusMode = function () {
            focusBanner.style.display = "none";
            if (focusedSprite) {
                focusedSprite.renderOrder = 0;
                focusedSprite.scale.copy(focusedSprite.userData.currentScale);
                focusedSprite = null;
            }
            sprites.forEach(s => {
                new TWEEN.Tween(s.material)
                    .to({ opacity: 1.0 }, 400)
                    .start();
            });
        };

        window.closePreview = function () {
            previewCard.style.display = "none";
            exitFocusMode();
        };

        // 🎯 앱 상에서 해당 사진의 3D 위치로 카메라 즉시 비행
        window.flyToCurrentPhoto = function () {
            if (!focusedSprite) return;
            enterFocusMode(focusedSprite);
        };

        // 📋 클립보드에 실제 이미지 직접 복사 (어디서나 Cmd+V / Ctrl+V 즉시 붙여넣기 지원)
        window.copyCurrentImage = async function (btnEl) {
            if (!focusedSprite || !focusedSprite.userData) return;
            const item = focusedSprite.userData;
            const imgUrl = item.fullResUrl || item.path || item.thumb_path;
            const originalText = btnEl ? btnEl.innerText : "이미지 복사";

            if (btnEl) btnEl.innerText = "복사 중...";

            try {
                // 이미지를 메모리 Canvas에 그려서 클립보드 표준 image/png Blob으로 변환
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = imgUrl;
                await new Promise((resolve, reject) => {
                    if (img.complete) return resolve();
                    img.onload = resolve;
                    img.onerror = reject;
                });

                const canvas = document.createElement("canvas");
                canvas.width = img.naturalWidth || img.width;
                canvas.height = img.naturalHeight || img.height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0);

                canvas.toBlob(async (blob) => {
                    if (!blob) throw new Error("이미지 데이터 변환 실패");
                    try {
                        await navigator.clipboard.write([
                            new ClipboardItem({ "image/png": blob })
                        ]);
                        if (btnEl) {
                            btnEl.innerText = "✓ 복사 완료!";
                            btnEl.style.borderColor = "#10b981";
                            btnEl.style.color = "#10b981";
                            setTimeout(() => {
                                btnEl.innerText = originalText;
                                btnEl.style.borderColor = "";
                                btnEl.style.color = "";
                            }, 1800);
                        }
                    } catch (clipErr) {
                        console.warn("ClipboardItem 이미지 복사 불가 (권한/브라우저 제한), 파일명 텍스트 복사 대체:", clipErr);
                        await navigator.clipboard.writeText(item.filename);
                        if (btnEl) {
                            btnEl.innerText = "파일명 복사됨!";
                            setTimeout(() => {
                                btnEl.innerText = originalText;
                            }, 1500);
                        }
                    }
                }, "image/png");
            } catch (err) {
                console.error("이미지 복사 실패:", err);
                if (btnEl) {
                    btnEl.innerText = "복사 실패";
                    setTimeout(() => {
                        btnEl.innerText = originalText;
                    }, 1500);
                }
            }
        };

        // 🔍 풀스크린 대형 라이트박스 뷰어 열기 / 닫기
        window.openLightbox = function () {
            if (!focusedSprite || !focusedSprite.userData) return;
            const item = focusedSprite.userData;
            const modal = document.getElementById("lightbox-modal");
            document.getElementById("lightbox-img").src = item.path;
            document.getElementById("lightbox-badge").innerText = item.category;
            document.getElementById("lightbox-badge").style.background = item.color || "#6366f1";
            document.getElementById("lightbox-name").innerText = item.filename;
            document.getElementById("lightbox-link").href = item.path;
            modal.style.display = "flex";
        };

        window.closeLightbox = function () {
            const modal = document.getElementById("lightbox-modal");
            if (modal) {
                modal.style.display = "none";
            }
        };

        window.resetCameraView = function () {
            exitFocusMode();
            let targetPos = DEFAULT_CAM_POS;
            if (currentLayout === 'grid') {
                const visibleCount = sprites.filter(s => s.visible).length;
                const cols = Math.ceil(Math.sqrt(visibleCount * 1.5));
                const rows = Math.ceil(visibleCount / cols);
                const spacingX = Math.max(nodeBaseSize * 2.2, 34);
                const spacingY = Math.max(nodeBaseSize * 1.9, 30);
                const fitZ = Math.max(cols * spacingX * 0.9, rows * spacingY * 1.25, 750);
                camera.up.set(0, 1, 0);
                targetPos = new THREE.Vector3(0, 0, fitZ);
            } else if (currentLayout === 'sphere') {
                camera.up.set(0, 1, 0);
                targetPos = new THREE.Vector3(0, 80, 900);
            } else {
                camera.up.set(0, 1, 0);
            }

            new TWEEN.Tween(camera.position)
                .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, 900)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            new TWEEN.Tween(controls.target)
                .to({ x: 0, y: 0, z: 0 }, 900)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();
        };

        window.toggleAutoRotate = function () {
            controls.autoRotate = !controls.autoRotate;
        };

        // Window Resize
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ⌨️ 키보드 네비게이션: W, A, S, D로 비행 이동 및 [ (축소/Zoom Out), ] (확대/Zoom In)
        const keysPressed = {};
        window.addEventListener("keydown", (e) => {
            // 텍스트 입력창(검색창 등)에 실제 텍스트 포커스가 있을 때만 키보드 이동 비활성화 (슬라이더 등은 영향 없음)
            if (e.target && (e.target.tagName === "TEXTAREA" || (e.target.tagName === "INPUT" && e.target.type !== "range"))) return;

            if (e.key === "Escape") {
                closeLightbox();
                closePreview();
                return;
            }

            const key = e.key.toLowerCase();
            keysPressed[key] = true;
            keysPressed[e.key] = true;
            keysPressed[e.code] = true;
        });

        window.addEventListener("keyup", (e) => {
            const key = e.key.toLowerCase();
            delete keysPressed[key];
            delete keysPressed[e.key];
            delete keysPressed[e.code];
        });

        // 윈도우 포커스를 잃으면 키 입력 초기화
        window.addEventListener("blur", () => {
            for (let k in keysPressed) delete keysPressed[k];
        });

        let lastTime = performance.now();

        // Main Animation Loop
        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);

            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            // 키보드 WASD 이동 & [ / ] 또는 - / + 줌 로직
            const isMoving = keysPressed['w'] || keysPressed['a'] || keysPressed['s'] || keysPressed['d'] ||
                keysPressed['KeyW'] || keysPressed['KeyA'] || keysPressed['KeyS'] || keysPressed['KeyD'] ||
                keysPressed['['] || keysPressed[']'] || keysPressed['BracketLeft'] || keysPressed['BracketRight'] ||
                keysPressed['-'] || keysPressed['='] || keysPressed['+'] || keysPressed['Minus'] || keysPressed['Equal'];

            if (isMoving) {
                // 카메라 거리에 비례하여 이동 속도를 동적으로 스케일링 (멀리 있을 땐 빠르게, 가까이선 정밀하게)
                const distToTarget = camera.position.distanceTo(controls.target);
                const moveSpeed = Math.max(distToTarget * 1.3, 160) * delta;
                const zoomSpeed = Math.max(distToTarget * 1.5, 200) * delta;

                // 카메라의 로컬 방향 벡터 (Right, Up, Forward)
                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);

                const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
                const up = camera.up.clone().normalize();

                const moveOffset = new THREE.Vector3();

                // W / S: 앞/뒤 전진 및 후진 (또는 격자 모드에서는 상/하 스크롤 이동)
                if (currentLayout === 'grid') {
                    // 격자 2D 캔버스 모드에서는 W: 위, S: 아래, A: 왼쪽, D: 오른쪽
                    if (keysPressed['w'] || keysPressed['KeyW']) moveOffset.addScaledVector(up, moveSpeed);
                    if (keysPressed['s'] || keysPressed['KeyS']) moveOffset.addScaledVector(up, -moveSpeed);
                    if (keysPressed['a'] || keysPressed['KeyA']) moveOffset.addScaledVector(right, -moveSpeed);
                    if (keysPressed['d'] || keysPressed['KeyD']) moveOffset.addScaledVector(right, moveSpeed);
                } else {
                    // 3D 은하 및 구체 모드에서는 W: 시선 방향 전진, S: 후진, A: 좌측 이동, D: 우측 이동
                    if (keysPressed['w'] || keysPressed['KeyW']) moveOffset.addScaledVector(forward, moveSpeed);
                    if (keysPressed['s'] || keysPressed['KeyS']) moveOffset.addScaledVector(forward, -moveSpeed);
                    if (keysPressed['a'] || keysPressed['KeyA']) moveOffset.addScaledVector(right, -moveSpeed);
                    if (keysPressed['d'] || keysPressed['KeyD']) moveOffset.addScaledVector(right, moveSpeed);
                }

                // [ 또는 - 키: 축소 (Zoom Out / 멀어지기)
                if (keysPressed['['] || keysPressed['BracketLeft'] || keysPressed['-'] || keysPressed['Minus']) {
                    moveOffset.addScaledVector(forward, -zoomSpeed);
                }
                // ] 또는 +/= 키: 확대 (Zoom In / 당겨보기)
                if (keysPressed[']'] || keysPressed['BracketRight'] || keysPressed['='] || keysPressed['+'] || keysPressed['Equal']) {
                    if (distToTarget > 25 || forward.dot(moveOffset) < 0) {
                        moveOffset.addScaledVector(forward, zoomSpeed);
                    }
                }

                camera.position.add(moveOffset);
                controls.target.add(moveOffset);
            }

            // 구체 표면 모드에서는 시선 피벗이 (0,0,0) 중심에서 이탈하지 않도록 락 유지 (단, WASD 이동 없을 때)
            if (currentLayout === 'sphere' && !focusedSprite && !isMoving) {
                controls.target.set(0, 0, 0);
            }

            // 🔲 격자 모드에서는 카메라가 비틀거리거나 목이 돌아가지 않도록 직각 정면(Up: 0, 1, 0 & Target.Z = 0) 완벽 고정
            if (currentLayout === 'grid') {
                camera.up.set(0, 1, 0);
                if (!focusedSprite) {
                    controls.target.z = 0;
                }
            }

            // 원거리 심우주 별들의 미세한 자연 자전 (초당 0.00008 rad의 극미세 궤도 유영)
            if (starField) {
                starField.rotation.y += 0.00008;
                starField.rotation.x += 0.00003;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
